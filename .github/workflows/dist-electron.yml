# Edición Electron de Normia Planos CAD.
#
# Compila un instalador por plataforma sin necesitar un PHP nativo: el
# intérprete viaja compilado a WebAssembly dentro de la aplicación. Un mismo
# paquete sirve para macOS Intel y Apple Silicon, Windows x64 y Linux x64.
#
# Firma: no hay certificados de Apple ni de Microsoft. macOS sale con firma
# ad-hoc (o sin firma) y Windows sin firmar; los avisos de Gatekeeper y
# SmartScreen se documentan en docs/ELECTRON.md y se muestran en «Acerca de».
name: Distribución de escritorio (Electron)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: electron-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  paquete:
    name: Instaladores · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          # La imagen Intel compila también el binario universal: electron-builder
          # admite las dos arquitecturas desde un solo trabajo.
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Instalar Electron y el empaquetador
        run: npm install --no-save --no-audit --no-fund electron@45 electron-builder@26

      - name: Comprobar el intérprete armado
        run: node tools/electron/build.mjs --out=dist/electron --sin-instalador

      - name: Armar y compilar el instalador
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder descarga el binario de Electron: sin espejos raros.
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/dist/electron/.cache
        run: |
          set -o pipefail
          node tools/electron/build.mjs --out=dist/electron --arch=${{ matrix.arch }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Las anotaciones del trabajo son lo único que se puede leer desde la API:
      # se publica el final del registro cuando algo falla.
      - name: Diagnóstico del armado
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            # La línea del error de electron-builder empieza con ⨯; el resto es
            # la pila, que no dice nada útil en una anotación.
            grep -E "⨯|^Error|error:|Cannot|failed" "$RUNNER_TEMP/build.log" | tail -8 | while IFS= read -r line; do
              echo "::error title=armado::${line//$'\r'/}"
            done
            tail -4 "$RUNNER_TEMP/build.log" | while IFS= read -r line; do
              echo "::error title=armado (final)::${line//$'\r'/}"
            done
          fi
          ls -R dist/electron/installers 2>/dev/null | head -30 || true

      - name: Comprobar el instalador
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/electron/installers
          case "${{ matrix.os }}" in
            macos-*) PATRON="*.dmg" ;;
            windows-*) PATRON="*-instalador.exe" ;;
            *) PATRON="*.AppImage" ;;
          esac
          # `find -printf` es exclusivo de GNU: se listan los archivos con el
          # propio intérprete de bash y así el guion sirve en los tres sistemas.
          ENCONTRADO=""
          for archivo in dist/electron/installers/*; do
            [ -f "$archivo" ] || continue
            case "$(basename "$archivo")" in
              $PATRON) ENCONTRADO="$archivo" ;;
            esac
          done
          if [ -z "$ENCONTRADO" ]; then
            echo "::error title=sin instalador::no se generó ningún archivo $PATRON"
            ls -l dist/electron/installers
            exit 1
          fi
          cd dist/electron/installers
          rm -f SHA256SUMS.txt
          for archivo in *; do
            [ -f "$archivo" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$archivo"; else shasum -a 256 "$archivo"; fi
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Comprobación del contenido con el Node del flujo. Se pasa la carpeta
      # como ruta **relativa**: vale igual en el Git Bash de Windows, en macOS y
      # en Linux, sin conversiones que Node no entienda.
      - name: Comprobar el contenido del paquete
        shell: bash
        run: |
          set -euo pipefail
          RESOURCES="$(find dist/electron/installers -type d -name runtime | head -1)"
          RESOURCES="$(dirname "$RESOURCES")"
          if [ ! -d "$RESOURCES/app" ]; then
            echo "::error title=paquete::no se encontró resources/app en el paquete"
            find dist/electron/installers -maxdepth 6 -type d -name app | head -10
            exit 1
          fi
          node tools/electron/verify-package.mjs "$RESOURCES" --completo

      # Prueba de humo del binario ya empaquetado. Lo que decide es la
      # comprobación del contenido: en un servidor sin pantalla Electron puede
      # no arrancar aunque el paquete esté bien, así que esta no invalida.
      - name: Prueba de humo del binario
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          export NORMA_DATA_PATH="$RUNNER_TEMP/normia-electron-humo"
          rm -rf "$NORMA_DATA_PATH"; mkdir -p "$NORMA_DATA_PATH"
          case "${{ matrix.os }}" in
            macos-*)
              APP="$(find dist/electron/installers -maxdepth 2 -name '*.app' | head -1)"
              if [ -n "$APP" ]; then "$APP/Contents/MacOS/Normia Planos CAD" --check; fi
              ;;
            windows-*)
              EXE="$(find dist/electron/installers -path '*win-unpacked*' -name '*.exe' | head -1)"
              if [ -n "$EXE" ]; then "$EXE" --check; fi
              ;;
            *)
              sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
              APPIMAGE="$(find dist/electron/installers -maxdepth 1 -name '*.AppImage' | head -1)"
              chmod +x "$APPIMAGE"
              xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --no-sandbox --disable-gpu --check
              ;;
          esac
          echo "::notice title=humo::el binario empaquetado arrancó y respondió a --check"


      - name: Diagnóstico del paquete
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/contenido.log" 2>/dev/null | tail -20 || true
          find dist/electron/installers -maxdepth 6 -type d \( -name resources -o -name Resources \) -print || true
          ls -la dist/electron/installers || true

      - name: Publicar los instaladores
        uses: actions/upload-artifact@v4
        with:
          name: normia-electron-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/electron/installers/*.dmg
            dist/electron/installers/*.zip
            dist/electron/installers/*.exe
            dist/electron/installers/*.AppImage
            dist/electron/installers/SHA256SUMS.txt
          if-no-files-found: error

  adjuntar:
    name: Adjuntar a la release
    needs: paquete
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publicar los archivos del release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
          fail_on_unmatched_files: false
          body: |
            Edición Electron de Normia Planos CAD: macOS (Intel y Apple Silicon),
            Windows x64 y Linux x64, con PHP 8.3 compilado a WebAssembly.
