# Distribución de escritorio: macOS 12+ y Windows 10/11.
#
# Genera el intérprete de PHP estático en el sistema operativo de destino (no hay
# compilación cruzada razonable), arma la carpeta de la aplicación, produce el
# instalador y **lo prueba instalado antes de publicarlo**. Los artefactos quedan
# en la pestaña Actions y, si se dispara con una etiqueta `v*`, se adjuntan a la
# release.
#
# Firmas: sin certificados de Apple ni de Microsoft. En macOS se firma el binario
# en modo ad-hoc y el instalador sale sin notarizar; en Windows, sin certificado
# OV/EV. Los dos muestran un aviso en el primer arranque y el instructivo de
# docs/ESCRITORIO.md explica cómo continuar.
name: Distribución de escritorio

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PHP_VERSION: '8.3'
  SPC_VERSION: '2.8.5'

jobs:
  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Las sumas van literales: el contexto `env` no existe al evaluar la
        # matriz. Son las de la release 2.8.5 de static-php-cli.
        include:
          - arch: arm64
            runner: macos-15
            spc: spc-macos-aarch64.tar.gz
            sha: acf2f25d56d0cbf8e65aa82e5054fef555f7be7c5c38046c6e0819f266d83225
          # macOS 13 (Intel) se retiró en diciembre de 2025 y un trabajo que pide
          # una etiqueta retirada se queda en cola para siempre. La última imagen
          # Intel es macos-15-intel; el destino sigue siendo macOS 12+.
          - arch: x64
            runner: macos-15-intel
            spc: spc-macos-x86_64.tar.gz
            sha: e8b798048f62ca4960764196543b60ae703f7174aa418824cf542aeec1d2cd6a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Descargar static-php-cli verificado
        run: |
          curl -fsSL -o spc.tar.gz "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/${{ matrix.spc }}"
          echo "${{ matrix.sha }}  spc.tar.gz" | shasum -a 256 -c -
          tar -xzf spc.tar.gz
          chmod +x spc

      # `spc craft` lee un craft.yml y hace todo el trabajo: descarga fuentes,
      # resuelve dependencias y compila. Se instalan las dependencias del
      # sistema con el propio verificador de spc.
      - name: Compilar PHP estático ${{ env.PHP_VERSION }}
        env:
          EXTENSIONS: pdo,sqlite3,pdo_sqlite,session,mbstring,openssl,fileinfo,tokenizer,ctype,filter,zlib
        run: |
          ./spc doctor --auto-fix || true
          cat > craft.yml <<EOF
          php-version: ${PHP_VERSION}
          extensions: "${EXTENSIONS}"
          sapi:
            - cli
          download-options:
            prefer-pre-built: true
          EOF
          cat craft.yml
          ./spc craft
          ls -la buildroot/bin
          BIN="$(find buildroot/bin -maxdepth 1 -type f -name 'php' | head -1)"
          echo "PHP_BIN=$PWD/$BIN" >> "$GITHUB_ENV"

      - name: Comprobar el intérprete
        run: |
          "$PHP_BIN" -v
          "$PHP_BIN" -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("mbstring") ? 0 : 1);'

      - name: Armar y probar la aplicación
        run: |
          node tools/desktop/build.mjs --platform=mac --php="$PHP_BIN" --out=dist --arch=${{ matrix.arch }}
          APP="dist/Normia Planos CAD.app"
          test -x "$APP/Contents/MacOS/Normia"
          export NORMA_DATA_PATH="$RUNNER_TEMP/normia-data"
          mkdir -p "$NORMA_DATA_PATH"
          "$APP/Contents/MacOS/Normia" --check
          # Arranque real: instalación limpia en la carpeta temporal y respuesta HTTP.
          "$APP/Contents/MacOS/Normia" --no-browser --port=8791 &
          sleep 4
          curl -fsS "http://127.0.0.1:8791/index.php?r=install" | grep -q "Normia"
          curl -fsS -o /dev/null -w "%{http_code}\n" "http://127.0.0.1:8791/storage/normia.sqlite" | grep -q 404
          "$APP/Contents/MacOS/Normia" --stop

      - name: Verificar el .pkg
        run: |
          PKG="$(ls dist/*-macos-*.pkg | head -1)"
          pkgutil --check-signature "$PKG" || true
          pkgutil --payload-files "$PKG" | grep -q "Aplicaciones\|Applications"

      - uses: actions/upload-artifact@v4
        with:
          name: normia-macos-${{ matrix.arch }}
          path: dist/*.pkg
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Se usa la acción oficial de PHP porque las compilaciones sueltas de
      # windows.php.net se archivan al cabo de unos meses y la URL cambia.
      - name: Instalar PHP para Windows
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, fileinfo
          coverage: none
          tools: none

      - name: Comprobar el intérprete
        shell: pwsh
        run: |
          $php = (Get-Command php).Source
          & $php -v
          & $php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"
          echo "PHP_DIR=$(Split-Path $php)" >> $env:GITHUB_ENV

      # Tres pasos y no uno: cuando algo falla, el nombre del paso dice qué
      # parte falló. Las anotaciones del trabajo solo dicen «exit code 1».
      - name: Armar la carpeta de la aplicación
        shell: pwsh
        run: |
          node tools/desktop/build.mjs --platform=win --php="$env:PHP_DIR" --out=dist 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\armar.log"
          if ($LASTEXITCODE -ne 0) { throw "El armado terminó con código $LASTEXITCODE" }

      - name: Revisar los archivos del paquete
        shell: pwsh
        run: |
          foreach ($f in @("dist\win-app\runtime\php.exe", "dist\win-app\Iniciar Normia.vbs",
                           "dist\win-app\index.php", "dist\win-app\runtime\ext\php_pdo_sqlite.dll")) {
            if (-not (Test-Path $f)) { throw "Falta $f" }
          }
          Write-Output "Interprete en: $((Get-Command "$env:PHP_DIR\php.exe").Source)"
          Get-ChildItem "dist\win-app\runtime" | Select-Object -First 12 -ExpandProperty Name
          Write-Output "--- php.ini del paquete ---"
          Get-Content "dist\win-app\runtime\php.ini"

      - name: Comprobar el intérprete del paquete
        shell: pwsh
        run: |
          $env:NORMA_DATA_PATH = "$env:RUNNER_TEMP\normia-data"
          New-Item -ItemType Directory -Force -Path $env:NORMA_DATA_PATH | Out-Null
          $salida = & "dist\win-app\runtime\php.exe" "dist\win-app\tools\desktop\launcher.php" --check 2>&1 | Out-String
          Write-Output $salida
          if ($LASTEXITCODE -ne 0) {
            $lineas = ($salida -split "`n" | Select-Object -Last 6) -join " | "
            Write-Output "::error title=interprete del paquete::$lineas"
            throw "El intérprete del paquete no sirve (código $LASTEXITCODE)"
          }

      # Arranca el servidor real del paquete y pide la pantalla de instalación.
      # Si algo falla, el paso siguiente publica los registros como anotaciones.
      - name: Arrancar y consultar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NORMA_DATA_PATH = "$env:RUNNER_TEMP\normia-data"
          New-Item -ItemType Directory -Force -Path $env:NORMA_DATA_PATH | Out-Null
          $server = Start-Process -FilePath "dist\win-app\runtime\php.exe" -PassThru -WindowStyle Hidden `
            -ArgumentList "dist\win-app\tools\desktop\launcher.php","--no-browser","--port=8792" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\launcher.out" -RedirectStandardError "$env:RUNNER_TEMP\launcher.err"
          $ok = $false
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $page = Invoke-WebRequest -Uri "http://127.0.0.1:8792/index.php?r=install" -UseBasicParsing -TimeoutSec 5
              if ($page.Content -match "Normia") { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "El servidor no respondió con la pantalla de instalación" }
          # El servidor local no debe entregar nada de storage/: el plano vive ahí.
          $vault = Invoke-WebRequest -Uri "http://127.0.0.1:8792/storage/normia.sqlite" -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 5
          if ($vault.StatusCode -ne 404) { throw "storage quedó accesible por HTTP ($($vault.StatusCode))" }
          & "dist\win-app\runtime\php.exe" "dist\win-app\tools\desktop\launcher.php" --stop
          Write-Output "Servidor local comprobado: instalación 200 y storage 404."

      - name: Diagnóstico del arranque
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\armar.log") {
            Write-Output "--- registro del armado ---"
            Get-Content "$env:RUNNER_TEMP\armar.log" -Tail 40
          }
          foreach ($f in @("dist\win-app\runtime\php.exe", "dist\win-app\runtime\php.ini",
                           "dist\win-app\runtime\ext\php_pdo_sqlite.dll", "dist\win-app\index.php")) {
            Write-Output "$f -> $(Test-Path $f)"
          }
          if (Test-Path "dist\win-app\runtime\php.ini") {
            Write-Output "--- php.ini ---"
            Get-Content "dist\win-app\runtime\php.ini" -Tail 20
          }
          Write-Output "PHP_DIR=$env:PHP_DIR"
          Get-ChildItem "dist\win-app\runtime" -ErrorAction SilentlyContinue | Select-Object -First 15 -ExpandProperty Name

          $dir = "$env:RUNNER_TEMP\normia-data"
          foreach ($f in @("storage\logs\servidor.log", "storage\logs\php-desktop.log")) {
            $path = Join-Path $dir $f
            if (Test-Path $path) {
              $tail = ((Get-Content $path -Tail 15) -join " | ")
              Write-Output "::error title=$f::$tail"
            } else {
              Write-Output "::warning title=sin registro::$f"
            }
          }
          foreach ($f in @("launcher.out", "launcher.err")) {
            $path = Join-Path $env:RUNNER_TEMP $f
            if (Test-Path $path) { Write-Output "::warning title=$f::$(((Get-Content $path -Tail 15) -join ' | '))" }
          }
          if (Test-Path (Join-Path $dir "storage\normia-desktop.json")) {
            Write-Output "::warning title=estado::$((Get-Content (Join-Path $dir 'storage\normia-desktop.json') -Raw) -replace '\s+',' ')"
          }

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar el instalador
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc "/DAppVersion=$version" "/DSourceDir=dist\win-app" "/DOutputDir=dist" "/DIconFile=dist\normia.ico" tools\desktop\windows\normia.iss
          if (-not (Test-Path "dist\normia-planos-cad-$version-windows-x64.exe")) { throw "No se generó el instalador" }

      - name: Instalación silenciosa y arranque
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "dist\normia-planos-cad-$version-windows-x64.exe"
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$env:RUNNER_TEMP\normia-instalada" -Wait
          $app = "$env:RUNNER_TEMP\normia-instalada"
          if (-not (Test-Path "$app\runtime\php.exe")) { throw "La instalación no copió el intérprete" }
          if (-not (Test-Path "$app\Iniciar Normia.vbs")) { throw "Falta el lanzador" }
          $env:NORMA_DATA_PATH = "$env:RUNNER_TEMP\normia-data-instalada"
          Start-Process -FilePath "$app\runtime\php.exe" -ArgumentList "$app\tools\desktop\launcher.php","--no-browser","--port=8793" -NoNewWindow
          Start-Sleep -Seconds 4
          $page = Invoke-WebRequest -Uri "http://127.0.0.1:8793/index.php?r=install" -UseBasicParsing
          if ($page.Content -notmatch "Normia") { throw "La app instalada no respondió" }
          & "$app\runtime\php.exe" "$app\tools\desktop\launcher.php" --stop

      - uses: actions/upload-artifact@v4
        with:
          name: normia-windows-x64
          path: dist/*windows-x64.exe
          if-no-files-found: error

  # ------------------------------------------------------------- publicación
  release:
    name: Adjuntar a la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Sumas SHA-256
        run: |
          cd artefactos
          find . -type f \( -name '*.pkg' -o -name '*.exe' \) -exec sha256sum {} \; | sed 's#\./[^/]*/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Adjuntar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artefactos/*/*.pkg artefactos/*/*.exe --clobber || \
          gh release create "${{ github.ref_name }}" artefactos/*/*.pkg artefactos/*/*.exe --title "Normia Planos CAD ${{ github.ref_name }}" --notes "Paquetes de escritorio generados por el flujo de trabajo."
